<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Validation Kanban</title>
    <link rel="stylesheet" href="/kanban.css">
</head>
<body>
<main>
    <header>
        <p class="eyebrow">CI/CD LOCAL VALIDATOR</p>
        <h1>Validation Kanban</h1>
        <p class="intro">Job Results will appear here when a Validation Run is submitted.</p>
    </header>
    <section class="board" aria-label="Validation Job Results">
        <article class="column" th:each="column : ${columns}">
            <header class="column-header">
                <h2 th:text="${column}">PENDING</h2>
                <span>0</span>
            </header>
            <div class="empty-state">No Jobs</div>
        </article>
    </section>
</main>
</body>
</html>
