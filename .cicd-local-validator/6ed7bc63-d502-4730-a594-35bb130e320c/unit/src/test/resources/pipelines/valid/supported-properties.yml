stages: [build, test]
yamlVariables:
  TOP_LEVEL: top
.default-job:
  image: alpine:3.20
  tags: [shared]
compile:
  extends: .default-job
  stage: build
  script: echo compile
  artifacts:
    paths: [build/output.txt]
test:
  image: alpine:3.20
  stage: test
  depends_on: [compile]
  needs: [compile]
  script:
    - echo test
  when: always

